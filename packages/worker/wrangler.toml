name = "agentclear-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Account is resolved from CLOUDFLARE_ACCOUNT_ID env var or wrangler login.
# account_id = "05c0b2967029ce0aa767889e9e66e766"

[vars]
X402_FACILITATOR_URL = "https://x402.org/facilitator"
USDC_ADDRESS = "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
# Set PAY_TO_ADDRESS to the operator wallet that should receive USDC.
# Override via `wrangler secret put PAY_TO_ADDRESS` for production.
PAY_TO_ADDRESS = "0x79eFeb66c313DA4F5D2A26bb5E15BEd86B98530f"

[dev]
port = 8787
local_protocol = "http"
